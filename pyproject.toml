[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exit-arc"
version = "0.2.0"
description = "Move your Arc browser spaces, pinned tabs, folders, favourites and extensions to Firefox, Zen or Chrome, or export them to plain files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
exit-arc = "exit_arc.cli:main"

[tool.setuptools]
packages = ["exit_arc"]
