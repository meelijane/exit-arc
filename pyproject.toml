[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-to-firefox"
version = "0.1.0"
description = "Move Arc browser spaces, pinned tabs, folders and favourites into Firefox bookmarks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
arc-to-firefox = "arc_to_firefox:main"

[tool.setuptools]
py-modules = ["arc_to_firefox"]
